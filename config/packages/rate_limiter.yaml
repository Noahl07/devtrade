framework:
    rate_limiter:
        # Inscription : 5 tentatives par heure par IP
        register:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

        # Waitlist : 3 inscriptions par heure par IP
        waitlist:
            policy: fixed_window
            limit: 3
            interval: '1 hour'

        # Mot de passe oublié : 5 demandes par heure par IP
        forgot:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

        # Contact : 5 messages par heure par IP
        contact:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

        # Login : 10 tentatives par 15 minutes par IP
        login:
            policy: fixed_window
            limit: 10
            interval: '15 minutes'
# Tests fonctionnels : limites relevées, sinon les tests successifs se bloquent entre eux
# (le stockage du limiteur persiste d'un test à l'autre).
when@test:
    framework:
        rate_limiter:
            register: { policy: fixed_window, limit: 1000, interval: '1 hour' }
            waitlist: { policy: fixed_window, limit: 1000, interval: '1 hour' }
            login: { policy: fixed_window, limit: 1000, interval: '15 minutes' }
            forgot: { policy: fixed_window, limit: 1000, interval: '1 hour' }
            contact: { policy: fixed_window, limit: 1000, interval: '1 hour' }
