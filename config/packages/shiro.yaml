# Données publiques du robot Shiro (page /trading).
#
# Règles (voir PROMPT-REFONTE-DEVTRADE.md §2 et §5.3) :
# - chaque série affiche sa période, son nombre de trades, sa nature (backtest),
#   le risque par trade et les coûts non inclus ;
# - une série n'apparaît sur le site que si `published: true` ;
# - ne jamais publier ici les paramètres internes du robot (décalage d'entrée,
#   retard max, durée exacte, stop ATR, spread max).
parameters:
    shiro.product_name: 'Shiro'
    shiro.symbol: 'USDJPY'
    shiro.demo_since: '30 octobre 2026'
    shiro.costs_note: >-
        La commission du courtier (environ 1 pip aller-retour) n'est pas incluse dans le testeur.
        Selon nos tests, l'avantage reste positif avec des coûts supplémentaires modérés,
        mais une exécution lente ou de mauvaise qualité le réduit nettement.

    # Tests au réglage par défaut du robot (0,5 à 1,5 % de risque par trade).
    # Source : rapports du testeur MetaTrader 5 fournis par l'auteur le 3 novembre 2026 (captures).
    # « Drawdown max » = « Fond Drawdown Maximal » du rapport MT5 (choix de l'auteur, 4 novembre 2026) :
    # plus forte baisse du capital en valeur, rapportée au capital du moment. Pour mémoire, le
    # « Fond Drawdown Relatif » (plus grand repli en %) vaut 7,15 % / 6,04 % / 3,02 % sur les mêmes tests.
    # Ne jamais publier ici la répartition du risque par type de jour (anti rétro-ingénierie).
    # num / decimals / prefix / suffix : animation des compteurs (la valeur affichée reste `value`).
    shiro.backtests:
        -   id: defaut_2016
            published: true
            tab: '2016 → oct. 2026'
            short: '2016'
            months: 130   # durée de la période, pour le comparateur
            title: "Dix ans d'historique"
            period: 'Janvier 2016 → octobre 2026'
            trades: 709
            risk: '0,5 à 1,5 % du solde par trade (réglage par défaut)'
            deposit: '10 000 USD'
            net: '+24 236,96 USD'
            source: 'Testeur de stratégie MetaTrader 5, ticks réels'
            quality: "Qualité de l'historique 99 %, environ 396 millions de ticks"
            metrics:
                - { label: 'Résultat cumulé', value: '+242,4 %', num: 242.4, decimals: 1, prefix: '+', suffix: ' %' }
                - { label: 'Profit factor', value: '2,08', num: 2.08, decimals: 2 }
                - { label: 'Trades gagnants', value: '57,0 %', num: 57.0, decimals: 1, suffix: ' %' }
                - { label: 'Drawdown max', value: '5,45 %', num: 5.45, decimals: 2, suffix: ' %' }

        -   id: defaut_2021
            published: true
            tab: '2021 → oct. 2026'
            short: '2021'
            months: 70   # durée de la période, pour le comparateur
            title: 'Depuis la rupture de 2021'
            period: 'Janvier 2021 → octobre 2026'
            trades: 376
            risk: '0,5 à 1,5 % du solde par trade (réglage par défaut)'
            deposit: '10 000 USD'
            net: '+16 054,01 USD'
            source: 'Testeur de stratégie MetaTrader 5, ticks réels'
            quality: "Qualité de l'historique 99 %, environ 196 millions de ticks"
            metrics:
                - { label: 'Résultat cumulé', value: '+160,5 %', num: 160.5, decimals: 1, prefix: '+', suffix: ' %' }
                - { label: 'Profit factor', value: '2,44', num: 2.44, decimals: 2 }
                - { label: 'Trades gagnants', value: '59,8 %', num: 59.8, decimals: 1, suffix: ' %' }
                - { label: 'Drawdown max', value: '5,45 %', num: 5.45, decimals: 2, suffix: ' %' }

        -   id: defaut_2026
            published: true
            tab: '2026'
            short: '2026'
            months: 10   # durée de la période, pour le comparateur
            title: 'Année en cours'
            period: 'Janvier → octobre 2026'
            trades: 55
            risk: '0,5 à 1,5 % du solde par trade (réglage par défaut)'
            deposit: '10 000 USD'
            net: '+1 855,72 USD'
            source: 'Testeur de stratégie MetaTrader 5, ticks réels'
            quality: "Qualité de l'historique 100 %, environ 50 millions de ticks"
            metrics:
                - { label: 'Résultat cumulé', value: '+18,6 %', num: 18.6, decimals: 1, prefix: '+', suffix: ' %' }
                - { label: 'Profit factor', value: '3,26', num: 3.26, decimals: 2 }
                - { label: 'Trades gagnants', value: '58,2 %', num: 58.2, decimals: 1, suffix: ' %' }
                - { label: 'Drawdown max', value: '2,98 %', num: 2.98, decimals: 2, suffix: ' %' }

        # Test du dossier v1.15 à risque fixe 0,5 % (693 trades, +57 %, baisse max du solde 3,2 %, PF 1,77) :
        # remplacé par les tests au réglage par défaut ci-dessus. Il reste la base des graphiques en R
        # (public/data/shiro/, générés par tools/shiro_charts.py depuis tokyo2016.csv).

    # Prochaines dates de trade : prévision fournie par l'auteur (3 novembre 2026).
    # NON PUBLIÉES sur le site (elles révèlent la règle de sélection des jours) : réservées aux clients.
    # Les jours fériés japonais n'ont PAS été recalculés ici : à vérifier avant chaque mise à jour.
    # type : exact (le 5, 10, 15, 20, 25 ou 30), decale (reporté au jour ouvré précédent), ignore (fin d'année).
    shiro.calendar:
        - { date: '2026-11-05', type: exact }
        - { date: '2026-11-10', type: exact }
        - { date: '2026-11-13', type: decale }   # le 15 tombe un dimanche
        - { date: '2026-11-20', type: exact }
        - { date: '2026-11-25', type: exact }
        - { date: '2026-11-30', type: exact }
        - { date: '2026-12-04', type: decale }   # le 5 tombe un samedi
        - { date: '2026-12-10', type: exact }
        - { date: '2026-12-15', type: exact }
        - { date: '2026-12-18', type: decale }   # le 20 tombe un dimanche
        - { date: '2026-12-25', type: ignore }
        - { date: '2026-12-30', type: ignore }
