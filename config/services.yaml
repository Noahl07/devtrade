# config/services.yaml

parameters:
    # Adresse d'expédition (variable MAILER_FROM). Avec l'API Gmail, ce doit être l'adresse du compte Gmail
    # ou un alias validé dans Gmail ; sinon Gmail la remplace par celle du compte.
    app.mail_from_default: 'contact@devtrade.fr'
    app.mail_from: '%env(default:app.mail_from_default:MAILER_FROM)%'
    # Destinataire des messages du formulaire de contact : variable Railway CONTACT_RECIPIENT
    # (jamais d'adresse personnelle dans ce dépôt public). À défaut, l'adresse du domaine.
    app.contact_recipient_default: 'contact@devtrade.fr'
    app.contact_recipient: '%env(default:app.contact_recipient_default:CONTACT_RECIPIENT)%'
    app.trades_premoderation_default: '1'
    # Paiement Premium (Stripe). Vide = paiement en ligne désactivé, la page Premium renvoie vers le contact.
    app.stripe.secret_key: '%env(default::STRIPE_SECRET_KEY)%'
    app.stripe.price_id: '%env(default::STRIPE_PRICE_ID)%'
    app.stripe.webhook_secret: '%env(default::STRIPE_WEBHOOK_SECRET)%'
    # Tarif affiché sur la page Premium (ex. « 19 € / mois »). Vide = « Tarif à venir ».
    app.premium_price_label: '%env(default::PREMIUM_PRICE_LABEL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── Traduction automatique ──
    # ── Locale subscriber ──
    App\EventSubscriber\LocaleSubscriber:
        arguments:
            $defaultLocale: '%kernel.default_locale%'
        tags:
            - { name: kernel.event_subscriber }

    App\Service\Billing\StripeBilling:
        arguments:
            $secretKey: '%app.stripe.secret_key%'
            $priceId: '%app.stripe.price_id%'
            $webhookSecret: '%app.stripe.webhook_secret%'

    App\Controller\PricingController:
        arguments:
            $priceLabel: '%app.premium_price_label%'

    # Envoi par l'API Gmail (MAILER_DSN=gmail+api://default)
    App\Mailer\GmailApiTransportFactory:
        arguments:
            $clientId: '%env(default::GMAIL_CLIENT_ID)%'
            $clientSecret: '%env(default::GMAIL_CLIENT_SECRET)%'
            $refreshToken: '%env(default::GMAIL_REFRESH_TOKEN)%'
        tags: ['mailer.transport_factory']

    # Salle des trades : validation avant publication (variable TRADES_PREMODERATION=0 pour publier directement)
    App\Service\Community\TradeWall:
        arguments:
            $premoderation: '%env(bool:default:app.trades_premoderation_default:TRADES_PREMODERATION)%'

    App\Service\ContactMessenger:
        arguments:
            $sender: '%app.mail_from%'
            $recipient: '%app.contact_recipient%'
            $publicAddress: 'contact@devtrade.fr'

# Tests : valeurs factices (aucun appel réel à Stripe, les tests signent eux-mêmes leurs webhooks).
when@test:
    parameters:
        app.stripe.secret_key: 'sk_test_factice'
        app.stripe.price_id: 'price_factice'
        app.stripe.webhook_secret: 'whsec_factice'
