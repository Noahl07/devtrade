[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.intl", "php84Extensions.opcache", "php84Extensions.tokenizer", "php84Extensions.ctype", "php84Extensions.session", "composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build"
]

[phases.build]
cmds = [
    "php bin/console cache:clear --env=prod",
    "php bin/console cache:warmup --env=prod"
]

[start]
cmd = "php bin/console doctrine:migrations:migrate --no-interaction --env=prod && frankenphp run --config /app/Caddyfile"